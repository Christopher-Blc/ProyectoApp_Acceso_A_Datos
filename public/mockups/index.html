<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResPi - Mockups</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .header {
            margin-bottom: 50px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 15px;
        }

        h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            font-weight: 300;
        }

        .mockups-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 40px;
        }

        .mockup-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 30px;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .mockup-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        .mockup-card.admin {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .mockup-card.admin:hover {
            box-shadow: 0 15px 40px rgba(245, 87, 108, 0.4);
        }

        .mockup-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .mockup-card h2 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .mockup-card p {
            font-size: 14px;
            opacity: 0.9;
            line-height: 1.5;
        }

        .button {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            padding: 10px 25px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            margin-top: auto;
        }

        .button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px;
            }

            .mockups-section {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            h1 {
                font-size: 24px;
            }

            .mockup-card h2 {
                font-size: 20px;
            }
        }

        .footer {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid #eee;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">⚽</div>
            <h1>ResPi Mockups</h1>
            <p class="subtitle">Vista previa de las interfaces de la aplicación</p>
        </div>

        <div class="mockups-section">
            <a href="cliente.html" class="mockup-card">
                <div class="mockup-icon">👤</div>
                <h2>Cliente</h2>
                <p>Interfaz de usuario para clientes</p>
                <button class="button">Ver Mockup</button>
            </a>

            <a href="admin.html" class="mockup-card admin">
                <div class="mockup-icon">⚙️</div>
                <h2>Administrador</h2>
                <p>Panel de control administrativo</p>
                <button class="button">Ver Mockup</button>
            </a>
        </div>

        <div class="footer">
            <p>&copy; 2026 ResPi - Reserva de espacios deportivos</p>
        </div>
    </div>
</body>
</html>
